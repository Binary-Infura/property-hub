name: Development Deploy

on:
  push:
    branches:
      - development

env:
  REGISTRY: ghcr.io
  # Replace with your actual repository if different
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:latest
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend:latest
  SCRAPER_IMAGE: ghcr.io/${{ github.repository }}-scraper:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            # Log in to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest images from remote package registry
            docker pull ${{ env.BACKEND_IMAGE }}
            docker pull ${{ env.FRONTEND_IMAGE }}
            docker pull ${{ env.SCRAPER_IMAGE }}
            
            # Create network if it doesn't exist
            docker network create property-hub-dev-net || true
            
            # Stop and remove existing containers
            docker stop property-hub-backend property-hub-frontend property-hub-scraper property-hub-nginx || true
            docker rm property-hub-backend property-hub-frontend property-hub-scraper property-hub-nginx || true
            
            # Navigate to project dir for config files (nginx.conf, .env)
            cd ~/property-hub || mkdir -p ~/property-hub && cd ~/property-hub

            # Run Backend
            docker run -d \
              --name property-hub-backend \
              --network property-hub-dev-net \
              --restart always \
              -p 3102:3102 \
              --env-file .env \
              ${{ env.BACKEND_IMAGE }}

            # Run Frontend
            docker run -d \
              --name property-hub-frontend \
              --network property-hub-dev-net \
              --restart always \
              -p 3101:3101 \
              --env-file .env \
              ${{ env.FRONTEND_IMAGE }}

            # Run Scraper
            docker run -d \
              --name property-hub-scraper \
              --network property-hub-dev-net \
              --restart always \
              --env-file .env \
              ${{ env.SCRAPER_IMAGE }}

            # Run Nginx
            docker run -d \
              --name property-hub-nginx \
              --network property-hub-dev-net \
              --restart always \
              -p 80:80 \
              -p 443:443 \
              -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf \
              nginx:alpine
