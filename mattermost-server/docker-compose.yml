version: '3.8'

services:
  # Mattermost Database
  postgres_mattermost:
    image: postgres:16-alpine
    container_name: mattermost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmsecret
      POSTGRES_DB: mattermost
    ports:
      - "5434:5432"   # Expose only if needed externally
    volumes:
      - mm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mattermost-network

  # Mattermost Application
  mattermost:
    image: mattermost/mattermost-team-edition:7.7.0
    container_name: mattermost-app
    restart: unless-stopped
    ports:
      - "8065:8065"  # Mattermost Web
    environment:
      MM_SQLSETTINGS_DRIVERNAME: "postgres"
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmsecret@postgres_mattermost:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEOPENREGISTRATION: "false"
      MM_SERVICESETTINGS_ENABLEUSERCREATION: "false"
      MM_AUTHSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
      MM_AUTHSETTINGS_ENABLESIGNUPWITHLDAP: "false"
    depends_on:
      postgres_mattermost:
        condition: service_healthy
    volumes:
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
      - mm_plugins:/mattermost/plugins
      - mm_config:/mattermost/config
    networks:
      - mattermost-network

volumes:
  mm_postgres_data:
    driver: local
  mm_data:
    driver: local
  mm_logs:
    driver: local
  mm_plugins:
    driver: local
  mm_config:
    driver: local

networks:
  mattermost-network:
    driver: bridge
