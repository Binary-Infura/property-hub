global:
  domain: "property-hub.local"

# Managed PostgreSQL Service Configuration (External to cluster)
database:
  host: "your-managed-db-host"
  user: "postgres"
  password: "your-password"
  name: "property_hub"
  port: 5432

# Property Hub Backend
backend:
  enabled: true
  image:
    repository: ghcr.io/binary-infura/property-hub-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3001
  env:
    # These will use the database settings above
    # Additional backend env vars can go here

# Property Hub Frontend
frontend:
  enabled: true
  image:
    repository: ghcr.io/binary-infura/property-hub-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000

# Property Hub Scraper
scraper:
  enabled: true
  image:
    repository: ghcr.io/binary-infura/property-hub-scraper
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3005

