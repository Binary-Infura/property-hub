apiVersion: v1
kind: Service
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-mattermost
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mattermost
spec:
  type: {{ .Values.mattermost.service.type }}
  ports:
    - port: {{ .Values.mattermost.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "property-hub-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mattermost
