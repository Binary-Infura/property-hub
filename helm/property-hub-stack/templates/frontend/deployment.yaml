apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-frontend
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:

      {{- include "property-hub-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "property-hub-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "http://{{ include "property-hub-stack.fullname" . }}-backend:3001"
            - name: NEXT_PUBLIC_LIVEKIT_URL
              value: "ws://{{ include "property-hub-stack.fullname" . }}-livekit:7880"
