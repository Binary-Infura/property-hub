apiVersion: v1
kind: Service
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-jitsi-web
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "property-hub-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-jitsi-prosody
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-prosody
spec:
  type: ClusterIP
  ports:
    - port: 5222
      targetPort: xmpp-client
      name: xmpp-client
    - port: 5269
      targetPort: xmpp-server
      name: xmpp-server
    - port: 5280
      targetPort: http
      name: http
  selector:
    {{- include "property-hub-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-prosody
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-jitsi-jvb
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-jvb
spec:
  type: LoadBalancer # JVB often needs direct external access, or use NodePort
  ports:
    - port: 10000
      targetPort: udp
      protocol: UDP
      name: udp
    - port: 4443
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    {{- include "property-hub-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-jvb
