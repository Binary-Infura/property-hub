apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-jitsi-jvb
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-jvb
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "property-hub-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jitsi-jvb
  template:
    metadata:
      labels:
        {{- include "property-hub-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jitsi-jvb
    spec:
      containers:
        - name: jvb
          image: "{{ .Values.jitsi.jvb.image }}"
          ports:
            - name: udp 
              containerPort: 10000 
              protocol: UDP
            - name: tcp
              containerPort: 4443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "property-hub-stack.fullname" . }}-jitsi-config
            - secretRef:
                name: {{ include "property-hub-stack.fullname" . }}-jitsi-secrets
          env:
            - name: JVB_AUTH_USER
              value: {{ .Values.jitsi.jvb.auth.user }}
            - name: JVB_PORT
              value: "10000"
            # Important for K8s: JVB typically needs to know the external IP
            - name: DOCKER_HOST_ADDRESS
              valueFrom: 
                fieldRef:
                  fieldPath: status.hostIP # Fallback, likely needs external IP config
