apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "property-hub-stack.fullname" . }}-jitsi-jicofo
  labels:
    {{- include "property-hub-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: jitsi-jicofo
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "property-hub-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jitsi-jicofo
  template:
    metadata:
      labels:
        {{- include "property-hub-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jitsi-jicofo
    spec:
      containers:
        - name: jicofo
          image: "{{ .Values.jitsi.jicofo.image }}"
          envFrom:
            - configMapRef:
                name: {{ include "property-hub-stack.fullname" . }}-jitsi-config
            - secretRef:
                name: {{ include "property-hub-stack.fullname" . }}-jitsi-secrets
          env:
            - name: JICOFO_AUTH_USER
              value: {{ .Values.jitsi.jicofo.auth.user }}
